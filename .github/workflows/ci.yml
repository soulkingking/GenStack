name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Windows 为受支持的原生开发平台，与 Linux 一同验证。
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # 与 README 验证清单保持一致：交付配置的语法问题应在合并前暴露。
      - name: Validate Docker Compose config
        if: runner.os == 'Linux'
        working-directory: .
        run: docker compose config --quiet

  # 端到端验证脚手架：生成项目、安装依赖、运行生成项目的后端测试。
  scaffold:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - name: Configure git identity for generated repository
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - name: Create project from local template
        # runner 在国外，覆盖默认的国内镜像源
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
          NPM_REGISTRY: https://registry.npmjs.org
        run: node packages/create-genstack/bin/create-genstack.mjs --template . ci-app ${{ runner.temp }}/ci-app
      - name: Run generated project backend tests (unix)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/ci-app/backend
        run: .venv/bin/pytest -q
      - name: Run generated project backend tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/ci-app/backend
        run: .venv\Scripts\pytest -q

  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本以 frontend/package.json 的 packageManager 字段为唯一来源。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # check = lint + typecheck + test + build，与本地合并前检查完全一致。
      - run: pnpm check
