name: genstack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genstack:latest
    ports:
      - "8000:8000"
    environment:
      APP_DEBUG: "false"
      CORS_ORIGINS: "http://localhost:8000"
      # Compose 从根目录 .env 插值，密钥只进入后端容器环境。
      OAUTH2_AUTHORIZE_URL: "${OAUTH2_AUTHORIZE_URL:-}"
      OAUTH2_TOKEN_URL: "${OAUTH2_TOKEN_URL:-}"
      OAUTH2_CLIENT_ID: "${OAUTH2_CLIENT_ID:-}"
      OAUTH2_CLIENT_SECRET: "${OAUTH2_CLIENT_SECRET:-}"
      OAUTH2_REDIRECT_URI: "${OAUTH2_REDIRECT_URI:-}"
      OAUTH2_SCOPE: "${OAUTH2_SCOPE:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      # 接入 Nacos 时取消注释并填入实际地址。
      # NACOS_ENABLED: "true"
      # NACOS_SERVER_ADDR: "nacos:8848"
      # NACOS_SERVICE_NAME: "genstack"
    volumes:
      - ./data:/app/data
    # 使用 Python 标准库探活，避免为健康检查额外安装 curl。
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
